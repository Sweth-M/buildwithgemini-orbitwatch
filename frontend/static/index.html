<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OrbitWatch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --bg-base: #060913;
    --bg-gradient-top: #0a1128;
    --bg-gradient-bottom: #02040a;
    --accent-cyan: #22D3EE;
    --accent-cyan-dim: rgba(34, 211, 238, 0.15);
    --gold-highlight: #FBBF24;
    --gold-glow: rgba(251, 191, 36, 0.25);
    --card-bg: rgba(13, 22, 44, 0.75);
    --card-border: rgba(34, 211, 238, 0.22);
    --user-bubble-bg: linear-gradient(135deg, #0e7490, #0891b2);
    --text-primary: #F1F5F9;
    --text-muted: #94A3B8;
    --status-green: #10B981;
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
    background: radial-gradient(ellipse at top, var(--bg-gradient-top) 0%, var(--bg-base) 60%, var(--bg-gradient-bottom) 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* CSS Twinkling Star Field */
  .stars, .stars2, .stars3 {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    background: transparent radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #22D3EE, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 80px, #FBBF24, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 310px 190px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 380px 60px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 400px 400px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  .stars2 {
    background: transparent radial-gradient(1.5px 1.5px at 70px 140px, #22D3EE, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 220px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 280px 110px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 330px 290px, #FBBF24, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 390px 350px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 550px 550px;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }

  .stars3 {
    background: transparent radial-gradient(1px 1px at 50px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 180px 260px, rgba(34,211,238,0.7), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 260px 40px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 650px 650px;
    animation: twinkle 5s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.35; transform: scale(0.99); }
    100% { opacity: 0.95; transform: scale(1.01); }
  }

  /* Header & Navigation */
  header {
    background: rgba(10, 17, 40, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(34, 211, 238, 0.2);
    padding: 0.85rem 1.25rem 0.6rem 1.25rem;
    position: relative;
    z-index: 10;
    text-align: center;
  }

  .header-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .app-title {
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
  }

  .app-subtitle {
    margin: 0.15rem 0 0 0;
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Status Bar */
  .status-strip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 0.45rem;
    padding: 0.2rem 0.65rem;
    border-radius: 9999px;
    background: rgba(2, 6, 23, 0.7);
    border: 1px solid rgba(34, 211, 238, 0.18);
    font-size: 0.74rem;
    color: #CBD5E1;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background-color: var(--status-green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--status-green);
    display: inline-block;
  }

  /* Main Chat Log */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.2rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }

  .msg {
    margin: 0.85rem 0;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble {
    display: inline-block;
    padding: 0.75rem 1rem;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    text-align: left;
    max-width: 88%;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: #ffffff;
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-bottom-right-radius: 3px;
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 3px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Table styles: Time & Elevation alignment */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.6rem 0;
    font-size: 0.88rem;
    background: rgba(10, 18, 38, 0.65);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(34, 211, 238, 0.2);
  }

  th, td {
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  th {
    background: rgba(34, 211, 238, 0.08);
    color: var(--accent-cyan);
    font-weight: 600;
    text-align: left;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
  }

  /* Specific column alignment for pass predictions */
  th.col-time, td.col-time,
  th:nth-child(2), td:nth-child(2),
  th:nth-child(3), td:nth-child(3) {
    font-variant-numeric: tabular-nums;
  }

  th.col-elevation, td.col-elevation,
  th:last-child, td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  tr.visible-pass td {
    color: var(--gold-highlight);
    background: var(--gold-glow);
    font-weight: 500;
  }

  /* Quick Prompts Container */
  .quick-prompts-bar {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0.35rem 1rem 0.5rem 1rem;
    display: flex;
    gap: 0.45rem;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    z-index: 10;
  }

  .quick-prompts-bar::-webkit-scrollbar {
    display: none;
  }

  .prompt-chip {
    flex: 0 0 auto;
    background: rgba(13, 22, 44, 0.8);
    border: 1px solid rgba(34, 211, 238, 0.3);
    color: #E2E8F0;
    padding: 0.42rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }

  .prompt-chip:hover {
    background: rgba(34, 211, 238, 0.18);
    border-color: var(--accent-cyan);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
  }

  .prompt-chip:active {
    transform: scale(0.97);
  }

  /* Input Form Container */
  .input-panel {
    background: rgba(10, 17, 40, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(34, 211, 238, 0.2);
    padding: 0.6rem 1rem 0.85rem 1rem;
    position: relative;
    z-index: 10;
  }

  form {
    display: flex;
    gap: 0.6rem;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }

  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(34, 211, 238, 0.25);
    border-radius: 12px;
    font-size: 0.95rem;
    background: rgba(6, 12, 28, 0.85);
    color: #ffffff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input::placeholder {
    color: #64748B;
  }

  input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.25);
  }

  button {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    box-shadow: 0 2px 8px rgba(8, 145, 178, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  button:hover {
    filter: brightness(1.15);
  }

  button:active {
    transform: scale(0.96);
  }

  /* --- A2UI Card & Component Styles --- */
  .a2card {
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 1.1rem;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    max-width: 100%;
    margin-top: 0.4rem;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 800; color: #ffffff; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #ffffff; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); }
  .a2text.a2-h4 { font-size: 1.0rem; font-weight: 600; color: #ffffff; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid rgba(34, 211, 238, 0.18); margin: 0.55rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid rgba(34, 211, 238, 0.25); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent-cyan); }

  /* Mobile Responsive Optimizations */
  @media (max-width: 600px) {
    header { padding: 0.65rem 1rem 0.5rem 1rem; }
    .app-title { font-size: 1.3rem; }
    .app-subtitle { font-size: 0.75rem; }
    #log { padding: 0.75rem; }
    .bubble { max-width: 94%; font-size: 0.92rem; }
    .quick-prompts-bar { padding: 0.35rem 0.65rem 0.45rem 0.65rem; }
    .prompt-chip { font-size: 0.74rem; padding: 0.35rem 0.65rem; }
    .input-panel { padding: 0.5rem 0.65rem 0.65rem 0.65rem; }
    input { font-size: 0.92rem; padding: 0.65rem 0.85rem; }
    button { padding: 0.65rem 1rem; font-size: 0.9rem; }
    th, td { padding: 0.45rem 0.5rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<!-- CSS Twinkling Night-Sky Stars -->
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<header>
  <div class="header-brand">
    <span class="material-symbols-outlined" style="font-size:1.6rem; color:var(--accent-cyan)">satellite_alt</span>
    <h1 class="app-title">OrbitWatch</h1>
  </div>
  <p class="app-subtitle">Look up. Right on time.</p>
  <div>
    <div class="status-strip">
      <span class="status-dot"></span>
      <span>Agent: Online</span>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="quick-prompts-bar">
  <button type="button" class="prompt-chip" data-prompt="Where is the ISS right now?">
    <span class="material-symbols-outlined" style="font-size:1rem;color:var(--accent-cyan)">my_location</span> Where is the ISS right now?
  </button>
  <button type="button" class="prompt-chip" data-prompt="When can I see the ISS this week?">
    <span class="material-symbols-outlined" style="font-size:1rem;color:var(--gold-highlight)">visibility</span> When can I see the ISS this week?
  </button>
  <button type="button" class="prompt-chip" data-prompt="How many Starlink satellites are overhead?">
    <span class="material-symbols-outlined" style="font-size:1rem;color:var(--accent-cyan)">radar</span> How many Starlink satellites are overhead?
  </button>
  <button type="button" class="prompt-chip" data-prompt="Show my sightings">
    <span class="material-symbols-outlined" style="font-size:1rem;color:var(--accent-cyan)">bookmark</span> Show my sightings
  </button>
</div>

<div class="input-panel">
  <form id="form">
    <input id="input" placeholder="Ask OrbitWatch about passes, satellites, or sightings…" autocomplete="off" autofocus>
    <button type="submit">
      <span class="material-symbols-outlined" style="font-size:1.15rem;margin-right:0.25rem;">send</span> Send
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Enhances pass tables with time & elevation column alignment and gold highlights.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) {
    for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  }
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      
      const content = boundStr(props.text);
      t.textContent = content;

      if (/visible|culmination|max el/i.test(content) && /yes|true|optimal|high/i.test(content)) {
        t.style.color = "var(--gold-highlight)";
        t.style.fontWeight = "600";
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "OrbitWatch badge";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.id && c.component) comps[c.id] = c.component;
      }
    }
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) {
      container.appendChild(node);
      drew = true;
    }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
      }
    }
  }
  return out.join("\n").trim();
}

function formatMarkdownTables(text) {
  if (!text.includes("|")) return null;
  const lines = text.trim().split("\n");
  const tableLines = lines.filter(l => l.trim().startsWith("|") && l.trim().endsWith("|"));
  if (tableLines.length < 2) return null;

  const table = el("table");
  const thead = el("thead");
  const tbody = el("tbody");

  let isHeader = true;
  for (let i = 0; i < tableLines.length; i++) {
    const rowText = tableLines[i];
    if (rowText.includes("---")) {
      isHeader = false;
      continue;
    }
    const cells = rowText.split("|").slice(1, -1).map(c => c.trim());
    const tr = el("tr");

    if (i > 1 && /visible|yes|clear/i.test(rowText)) {
      tr.className = "visible-pass";
    }

    cells.forEach((cell, idx) => {
      const cellEl = el(isHeader ? "th" : "td", null, cell);
      if (idx === 1 || idx === 2) cellEl.className = "col-time";
      if (idx === cells.length - 1) cellEl.className = "col-elevation";
      tr.appendChild(cellEl);
    });

    if (isHeader) thead.appendChild(tr);
    else tbody.appendChild(tr);
  }

  table.appendChild(thead);
  table.appendChild(tbody);
  return table;
}

function renderReply(b, parts) {
  b.textContent = "";
  // De-duplicate repetitive identical parts if returned by stream updates
  const seenTexts = new Set();
  const texts = [];
  const a2ui = [];

  for (const p of parts) {
    if (!p) continue;
    if (p.kind === "a2ui" && p.data) {
      a2ui.push(p.data);
    } else {
      let t = p.text || (typeof p === "string" ? p : "");
      if (t && !seenTexts.has(t)) {
        seenTexts.add(t);
        // Check if the model embedded an <a2ui-json> block directly in the text
        if (t.includes("<a2ui-json>")) {
          const m = t.match(/<a2ui-json>([\s\S]*?)<\/a2ui-json>/);
          if (m) {
            try {
              const parsed = JSON.parse(m[1].trim());
              if (Array.isArray(parsed)) {
                parsed.forEach(item => a2ui.push(item));
              } else if (typeof parsed === "object") {
                a2ui.push(parsed);
              }
            } catch (err) {
              console.warn("Could not parse inline <a2ui-json> block", err);
            }
            t = t.replace(/<a2ui-json>[\s\S]*?<\/a2ui-json>/g, "").trim();
          }
        }
        if (t) texts.push(t);
      }
    }
  }

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const tableEl = formatMarkdownTables(textStr);
    if (tableEl) {
      b.appendChild(tableEl);
    } else {
      b.appendChild(el("div", null, textStr));
    }
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    }
  }

  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.textContent = "Scanning skies…";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`);
    }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  sendMessage(input.value.trim());
});

// Clickable Example Prompts
document.querySelectorAll(".prompt-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const prompt = chip.getAttribute("data-prompt");
    if (prompt) sendMessage(prompt);
  });
});
</script>
